name: Synchronisation SofaScore

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sofascore-sync.yml'
  schedule:
    # Passage principal toutes les 15 minutes, loin du début de l'heure où
    # GitHub peut retarder ou supprimer des événements planifiés. Pendant un
    # match, le passage reste actif et contrôle toutes les 5 minutes jusqu'à
    # l'ouverture effective du vote.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psg-hub-sofascore-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le collecteur sécurisé
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Mettre à jour PSG Hub
        run: node scripts/sofascore-sync.mjs
        env:
          PSG_HUB_SYNC_URL: ${{ vars.PSG_HUB_SYNC_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome

