name: Synchronisation SofaScore

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'package*.json'
  schedule:
    # Réveil de secours. Le robot collecte toutes les 8 h, toutes les 15 min à
    # moins de 10 h du match, puis toutes les 5 min du coup d'envoi au vote.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: psg-hub-sofascore-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le collecteur sécurisé
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier les scénarios de panne
        run: npm test
      - name: Contrôler si un passage est nécessaire
        id: freshness
        shell: bash
        env:
          PSG_HUB_SYNC_URL: ${{ vars.PSG_HUB_SYNC_URL }}
        run: echo "stale=$(node scripts/sofascore-freshness.mjs)" >> "$GITHUB_OUTPUT"
      - name: Mettre à jour PSG Hub
        id: sync
        if: steps.freshness.outputs.stale == 'true' || github.event_name != 'schedule'
        run: node scripts/sofascore-sync.mjs
        env:
          PSG_HUB_SYNC_URL: ${{ vars.PSG_HUB_SYNC_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
          SOFASCORE_HOT_MAX_MINUTES: '325'
      - name: Passer le relais au prochain cycle continu
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sofascore-sync.yml --ref main
