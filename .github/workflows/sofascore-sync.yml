name: Synchronisation SofaScore

on:
  schedule:
    # Décalé des minutes de forte charge de GitHub Actions.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psg-hub-sofascore-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le collecteur sécurisé
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Mettre à jour PSG Hub
        run: node scripts/sofascore-sync.mjs
        env:
          PSG_HUB_SYNC_URL: ${{ vars.PSG_HUB_SYNC_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
