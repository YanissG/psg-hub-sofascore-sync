name: Maintenir le robot actif

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Enregistrer une activité mensuelle
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-activity.txt
          git config user.name 'psg-hub-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/last-activity.txt
          git diff --cached --quiet || git commit -m 'chore: keep automation active'
          git push
