name: Relais temporaire SofaScore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: psg-hub-sofascore-sync
  cancel-in-progress: false

jobs:
  maintain-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Suivre le match avec le collecteur unique
        run: node scripts/sofascore-sync.mjs
        env:
          PSG_HUB_SYNC_URL: ${{ vars.PSG_HUB_SYNC_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome
